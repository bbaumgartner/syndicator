[project]
name = "syndicator"
version = "0.2.0"
description = "Thin local trigger for sailingnomads.ch: extract the Logseq diary, upload originals over SFTP and fire the n8n publish/reel webhooks"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "paramiko>=3.4",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.scripts]
syndicator = "syndicator.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/syndicator"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
