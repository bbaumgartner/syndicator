# Phase 1 syndicator stack: SFTP staging + n8n (regular/SQLite) + pyautoflip.
# Usage (from this directory):
#   bin/syndicator init    # fill the requested values in .env
#   bin/syndicator deploy

name: syndicator

services:
  # Docker named volumes are root-owned on first create; n8n + pyautoflip run as uid 1000.
  files-init:
    image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
    volumes:
      - n8n_files:/data
    command:
      [
        "sh",
        "-c",
        "chown 1000:1000 /data && chmod 775 /data",
      ]
    restart: "no"

  sftp:
    image: atmoz/sftp:alpine@sha256:81fa92512bf8ead4849f33c1c153907b86d32d77704d1c62a9c70b4316ae9e50
    # The upstream image is amd64-only; Docker Desktop emulates it on Apple Silicon.
    platform: ${SFTP_PLATFORM:-linux/amd64}
    restart: unless-stopped
    ports:
      - "${SFTP_BIND_ADDRESS:-127.0.0.1}:${SFTP_PUBLISH_PORT:-2222}:22"
    volumes:
      - sftp_data:/home/sftp/syndicator
      # Client public keys (ensure-sftp-keys.sh writes n8n.pub here).
      - ${SFTP_KEYS_DIR:-./sftp/keys}:/home/sftp/.ssh/keys:ro
      # Server host keys generated on first start; survive recreate.
      - sftp_host_keys:/etc/ssh/host_keys
      # Supported atmoz startup hook; avoids replacing the sshd binary.
      - ./sftp/setup.sh:/etc/sftp.d/10-syndicator.sh:ro
    # user::uid:gid:dirs — empty password → key-only auth
    command: sftp::1001:100:syndicator
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "kill -0 1 && /usr/sbin/sshd -t",
        ]
      interval: 10s
      timeout: 5s
      retries: 3

  n8n:
    build: ./n8n
    image: syndicator-n8n:${SYNDICATOR_IMAGE_TAG:-local}
    restart: unless-stopped
    ports:
      - "${N8N_BIND_ADDRESS:-127.0.0.1}:${N8N_HOST_PORT:-5678}:5678"
    # Password hash written by ./scripts/ensure-n8n-owner.sh (bcrypt; $ escaped as $$).
    env_file:
      - ${N8N_OWNER_ENV_FILE:-secrets/n8n_owner.env}
    environment:
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Europe/Zurich}
      TZ: ${GENERIC_TIMEZONE:-Europe/Zurich}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY in .env}
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: ${N8N_PORT:-5678}
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-${WEBHOOK_URL:-http://localhost:5678/}}
      N8N_PROXY_HOPS: ${N8N_PROXY_HOPS:-0}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_RESTRICT_FILE_ACCESS_TO: /files
      N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE:-false}
      N8N_COMMUNITY_PACKAGES_ENABLED: "true"
      N8N_UNVERIFIED_PACKAGES_ENABLED: "true"
      N8N_RUNNERS_TASK_TIMEOUT: "300"
      N8N_COMPRESSION_NODE_MAX_DECOMPRESSED_SIZE_BYTES: "268435456"
      N8N_COMPRESSION_NODE_MAX_ZIP_ENTRIES: "1000"
      N8N_INSTANCE_OWNER_MANAGED_BY_ENV: "true"
      N8N_INSTANCE_OWNER_EMAIL: ${N8N_OWNER_EMAIL:?set N8N_OWNER_EMAIL in .env}
      N8N_INSTANCE_OWNER_FIRST_NAME: ${N8N_OWNER_FIRST_NAME:-Syndicator}
      N8N_INSTANCE_OWNER_LAST_NAME: ${N8N_OWNER_LAST_NAME:-Owner}
    volumes:
      - n8n_data:/home/node/.n8n
      - n8n_files:/files
    depends_on:
      files-init:
        condition: service_completed_successfully
      sftp:
        condition: service_healthy
      pyautoflip:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:5678/healthz/readiness >/dev/null || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  pyautoflip:
    build:
      context: ./pyautoflip
      args:
        PYAUTOFLIP_WARM_MODELS: ${PYAUTOFLIP_WARM_MODELS:-1}
    image: syndicator-pyautoflip:${SYNDICATOR_IMAGE_TAG:-local}
    # Same uid as n8n (node) so /files writes are readable by both.
    # HOME contains the image-pinned InsightFace models and remains writable.
    user: "1000:1000"
    environment:
      HOME: /home/pyautoflip
    restart: unless-stopped
    volumes:
      - n8n_files:/files
    depends_on:
      files-init:
        condition: service_completed_successfully
    expose:
      - "8080"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s

volumes:
  sftp_data:
  sftp_host_keys:
  n8n_data:
  n8n_files:
