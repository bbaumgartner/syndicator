# Shared configuration, committed to git and identical on both machines.
# Machine-specific paths live in config.local.yaml (see config.local.yaml.example).
#
# v2 (n8n migration): the local client only extracts the diary, adapts media,
# uploads over SFTP and fires the n8n webhooks. Translation, captions and the
# Hugo render live in n8n; the final site commit is a manual local step. Their
# prompts/models are no longer configured here.

site:
  title: "Sailing Nomads"
  base_url: "https://www.sailingnomads.ch"
  # Language served at the site root; all others live under /<lang>/. Only used
  # locally to build the post_url that ships in the webhook payloads.
  default_language: en

media:
  # Local crop-focus vision LLM used by media_adapt (the only LLM step that
  # stays local). See prompts/crop_focus.md.
  crop_focus:
    enabled: true
    model: gpt-5.4-mini

# SFTP staging area on the owner's server. Hugo-ready output mirrors the site
# checkout below <base_dir>/sailingnomads/ (content/posts/<slug>/ + static/);
# social-only files remain below <base_dir>/<slug>/. Every sftp_path in the
# webhook contracts is chroot-absolute and passed verbatim.
sftp:
  host: 144.2.110.132
  port: 22
  user: sftp
  base_dir: /syndicator

# n8n production webhook URLs. Filled in after the Phase 1 workflows are created
# and their production webhooks activated.
webhooks:
  publish_url: "http://192.168.0.26:5678/webhook/publish"
  reel_url: "http://192.168.0.26:5678/webhook/reel"

# Per-channel media specs. hugo = the site bundle; facebook/instagram/x = social
# reels + header crops. Reel/header specs are per channel so a later platform can
# diverge without contract changes. At launch all three social channels use 4:5
# 1080x1350 reels; only max_seconds differs (IG 90 vs FB/X longer), so a short
# source shares one reel file across platforms.
channels:
  hugo:
    kind: site
    enabled: true
    image: { mode: copy }
    video: { aspect: "16:9", width: 700, height: 394, pad_mode: crop }
  facebook:
    kind: social
    enabled: true
    image: { mode: convert, max_edge: 2048, format: jpeg, quality: 90 }
    video: { max_seconds: 240 }
    reel_video: { aspect: "4:5", width: 1080, height: 1350, max_seconds: 240, pad_mode: crop }
  instagram:
    kind: social
    enabled: true
    image: { mode: convert, aspect: "4:5", width: 1080, height: 1350, format: jpeg, quality: 90 }
    video: { aspect: "4:5", width: 1080, height: 1350, max_seconds: 90, pad_mode: crop }
    reel_video: { aspect: "4:5", width: 1080, height: 1350, max_seconds: 90, pad_mode: crop }
  x:
    kind: social
    enabled: true
    image: { mode: convert, max_edge: 2048, format: jpeg, quality: 90 }
    video: { max_seconds: 140 }
    reel_video: { aspect: "4:5", width: 1080, height: 1350, max_seconds: 140, pad_mode: crop }
