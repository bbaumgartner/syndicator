# Shared configuration, committed to git and identical on both machines.
# Machine-specific paths live in config.local.yaml (see config.local.yaml.example).
#
# v2: the local client extracts the diary, uploads immutable originals under
# <base>/<slug>/source/, and fires the n8n webhooks. Media adaptation (Edit Image
# + FFmpeg + OpenAI crop-focus), translation, captions and Hugo render live in n8n.

site:
    title: "Sailing Nomads"
    base_url: "https://www.sailingnomads.ch"
    # Language served at the site root; all others live under /<lang>/. Only used
    # locally to build the post_url that ships in the webhook payloads.
    default_language: en

# SFTP staging area. Client writes immutable originals under <base>/<slug>/source/;
# n8n builds sailingnomads/content/posts/<slug>/ and social derivatives from
# slug + basenames in the webhook contracts (layout is hardcoded in Adapt workflows).
sftp:
  host: 144.2.110.132
  port: 22
  user: sftp
  base_dir: /syndicator

webhooks:
  publish_url: "http://192.168.0.26:5678/webhook/publish"
  reel_url: "http://192.168.0.26:5678/webhook/reel"
